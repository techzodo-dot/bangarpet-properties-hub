# Render blueprint: New > Blueprint > pick this repository.
# You will be asked for the values marked "sync: false" (site URL and admin password).
# Uploaded photos need the persistent disk below (available on paid instance types).
services:
  - type: web
    name: bangarpet-property-hub
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/release.sh && gunicorn -c gunicorn.conf.py config.wsgi:application
    healthCheckPath: /healthz/
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bph-db
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: ADMIN_USERNAME
        value: bph@admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: SERVE_MEDIA
        value: "True"
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: PRIVATE_MEDIA_ROOT
        value: /var/data/private_media

databases:
  - name: bph-db
    databaseName: bph
    user: bph
