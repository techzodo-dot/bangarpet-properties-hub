<dl class="small mb-2 mt-2">
  {% if not hide_plan_price %}<div class="d-flex justify-content-between gap-3"><dt class="text-muted fw-normal">Plan price</dt><dd class="mb-1">₹{{ plan.effective_price|floatformat:2 }}</dd></div>{% endif %}
  <div class="d-flex justify-content-between gap-3"><dt class="text-muted fw-normal">GST ({{ plan.gst_percent|floatformat:-2 }}%)</dt><dd class="mb-1">₹{{ plan.gst_amount|floatformat:2 }}</dd></div>
  <div class="d-flex justify-content-between gap-3 border-top pt-2"><dt>Total payable</dt><dd class="mb-0 fw-bold">₹{{ plan.total_price|floatformat:2 }}</dd></div>
</dl>
