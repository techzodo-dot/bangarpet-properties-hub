{% load static %}<!doctype html>
<html lang="en-IN" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <title>You're offline - Bangarpet Property Hub</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  <main class="d-grid" style="min-height:100vh;place-items:center;padding:1.5rem">
    <div class="form-card text-center" style="max-width:440px">
      <img src="{% static 'img/logo-mark.svg' %}" alt="" width="96" height="77" class="mb-3">
      <h1 class="h3">You're offline</h1>
      <p class="text-muted mb-4">Bangarpet Property Hub needs an internet connection to show the latest listings. Check your connection and try again.</p>
      <button class="btn btn-accent btn-lg w-100" type="button" onclick="location.reload()"><i class="bi bi-arrow-clockwise me-1" aria-hidden="true"></i>Try again</button>
    </div>
  </main>
</body>
</html>
