{% extends "accounts/auth_base.html" %}
{% block title %}Password updated - {{ site.site_name }}{% endblock %}
{% block auth_content %}
<div class="text-center">
  <i class="bi bi-shield-check display-5 text-verified"></i>
  <h1 class="h3 mt-3">Password updated</h1>
  <p class="text-muted">You can now sign in with your new password.</p>
  <a class="btn btn-primary" href="{% url 'accounts:login' %}">Sign in</a>
</div>
{% endblock %}
