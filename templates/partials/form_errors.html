{% load i18n %}{% if form.non_field_errors %}
<div class="alert alert-danger rounded-4" role="alert">
  {% for error in form.non_field_errors %}<div><i class="bi bi-exclamation-circle me-1"></i>{{ error }}</div>{% endfor %}
</div>
{% elif form.errors %}
<div class="alert alert-danger rounded-4" role="alert"><i class="bi bi-exclamation-circle me-1"></i>{% translate "Please correct the highlighted fields below." %}</div>
{% endif %}
