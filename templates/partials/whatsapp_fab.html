<a class="wa-fab no-print" href="https://wa.me/{{ site.whatsapp_digits }}?text={{ wa_text|urlencode }}" target="_blank" rel="noopener" aria-label="{% translate 'Chat with us on WhatsApp' %}" title="{% translate 'Chat with us on WhatsApp' %}">
