{% with path=request.path %}
<nav class="mobile-tabbar" aria-label="Quick navigation">
  <a href="{% url 'core:home' %}" class="{% if path == '/' %}active{% endif %}"><i class="bi bi-house-door"></i>Home</a>
  <a href="{% url 'properties:search' %}" class="{% if path == '/properties/' %}active{% endif %}"><i class="bi bi-search"></i>Search</a>
  {% if user.is_authenticated and user.is_partner %}
    <a href="{% url 'dashboard:partner_property_add' %}"><i class="bi bi-plus-square"></i>List</a>
  {% elif user.is_authenticated and not user.is_platform_admin %}
    <a href="{% url 'dashboard:customer_favourites' %}" class="{% if 'favourites' in path %}active{% endif %}"><i class="bi bi-heart"></i>Saved</a>
  {% else %}
    <a href="{% url 'accounts:register' %}?type=owner"><i class="bi bi-plus-square"></i>List</a>
  {% endif %}
  {% if user.is_authenticated %}
    <a href="{% url 'notifications:list' %}" class="position-relative {% if '/notifications/' in path %}active{% endif %}"><i class="bi bi-bell"></i>Alerts</a>
    <a href="{% url user.dashboard_url_name %}" class="{% if '/dashboard/' in path or '/partner/' in path %}active{% endif %}"><i class="bi bi-person"></i>Account</a>
  {% else %}
    <a href="{% url 'accounts:login' %}"><i class="bi bi-person"></i>Sign in</a>
  {% endif %}
</nav>
{% endwith %}
